<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>人力安排（週一–週五）</title>
<style>
  :root {
    --ink: #24292E;
    --ink-soft: #7A7F78;
    --line: #E6E4DC;
    --on-bg: #E3F0E9;
    --on-ink: #1F5A4C;
    --full-bg: #2F6B5E;
    --full-ink: #FFFFFF;
    --off-bg: #F3F2EE;
    --warn: #A9721A;
    --warn-bg: #F9EED4;
  }
  body {
    background: #FFFFFF;
    color: var(--ink);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
    line-height: 1.6;
    margin: 0;
    padding: 40px 24px 56px;
  }
  .wrap { max-width: 820px; margin: 0 auto; }

  .section-label {
    font-size: 0.78rem; font-weight: 700; letter-spacing: 0.14em;
    color: var(--ink-soft); margin: 0 0 12px;
  }

  .board {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 20px 22px 16px;
    background: #FFFFFF;
    overflow-x: auto;
  }

  table { border-collapse: separate; border-spacing: 5px; width: 100%; min-width: 560px; }
  th { padding: 4px 6px; font-size: 0.9rem; }
  thead th { color: var(--ink); font-weight: 700; }
  thead th small { display: block; font-size: 0.72rem; font-weight: 400; color: var(--ink-soft); }
  tbody th { text-align: left; white-space: nowrap; padding-right: 14px; font-weight: 700; }
  tbody th .per-count { font-size: 0.78rem; color: var(--ink-soft); font-weight: 400; margin-left: 6px; font-variant-numeric: tabular-nums; }
  td { text-align: center; padding: 0; }

  .cell {
    height: 42px; border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.9rem; font-weight: 700;
  }
  .on  { background: var(--on-bg); color: var(--on-ink); }
  .off { background: var(--off-bg); color: #C9C7BF; }

  /* 當日人手列 */
  tfoot th { text-align: left; font-weight: 700; white-space: nowrap; padding-right: 14px; }
  tfoot td { padding-top: 6px; }
  .count {
    height: 46px; border-radius: 7px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-variant-numeric: tabular-nums; line-height: 1.2;
  }
  .count b { font-size: 1.15rem; }
  .count small { font-size: 0.68rem; font-weight: 600; }
  .count.mid  { background: var(--on-bg); color: var(--on-ink); }
  .count.max  { background: var(--full-bg); color: var(--full-ink); }
  .count.min  { background: var(--warn-bg); color: var(--warn); border: 1.5px dashed var(--warn); }

  .legend {
    display: flex; flex-wrap: wrap; gap: 18px;
    margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line);
    font-size: 0.8rem; color: var(--ink-soft);
  }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
  .dot.max { background: var(--full-bg); }
  .dot.mid { background: var(--on-bg); }
  .dot.min { background: var(--warn-bg); border: 1.5px dashed var(--warn); box-sizing: border-box; }
</style>
</head>
<body>
<div class="wrap">
  <p class="section-label">個人班表（1–5＝週一至週五）</p>

  <div class="board">
    <table>
      <thead>
        <tr>
          <th></th>
          <th>週一<small>1</small></th>
          <th>週二<small>2</small></th>
          <th>週三<small>3</small></th>
          <th>週四<small>4</small></th>
          <th>週五<small>5</small></th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th>枋佑<span class="per-count">3 天</span></th>
          <td><div class="cell off">·</div></td>
          <td><div class="cell on">✓</div></td>
          <td><div class="cell on">✓</div></td>
          <td><div class="cell off">·</div></td>
          <td><div class="cell on">✓</div></td>
        </tr>
        <tr>
          <th>詠俊<span class="per-count">4 天</span></th>
          <td><div class="cell on">✓</div></td>
          <td><div class="cell on">✓</div></td>
          <td><div class="cell off">·</div></td>
          <td><div class="cell on">✓</div></td>
          <td><div class="cell on">✓</div></td>
        </tr>
        <tr>
          <th>郁豊<span class="per-count">4 天</span></th>
          <td><div class="cell on">✓</div></td>
          <td><div class="cell on">✓</div></td>
          <td><div class="cell off">·</div></td>
          <td><div class="cell on">✓</div></td>
          <td><div class="cell on">✓</div></td>
        </tr>
        <tr>
          <th>品毅<span class="per-count">3 天</span></th>
          <td><div class="cell off">·</div></td>
          <td><div class="cell on">✓</div></td>
          <td><div class="cell on">✓</div></td>
          <td><div class="cell off">·</div></td>
          <td><div class="cell on">✓</div></td>
        </tr>
        <tr>
          <th>政翰<span class="per-count">3 天</span></th>
          <td><div class="cell on">✓</div></td>
          <td><div class="cell on">✓</div></td>
          <td><div class="cell on">✓</div></td>
          <td><div class="cell off">·</div></td>
          <td><div class="cell on">✓</div></td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <th>當日人手</th>
          <td><div class="count mid"><b>3</b><small>人</small></div></td>
          <td><div class="count max"><b>5</b><small>全員</small></div></td>
          <td><div class="count mid"><b>3</b><small>人</small></div></td>
          <td><div class="count min"><b>2</b><small>最少</small></div></td>
          <td><div class="count max"><b>5</b><small>全員</small></div></td>
        </tr>
      </tfoot>
    </table>

    <div class="legend">
      <span><span class="dot max"></span>全員到齊（5 人）</span>
      <span><span class="dot mid"></span>一般人力</span>
      <span><span class="dot min"></span>人力最少（週四僅詠俊、郁豊）</span>
    </div>
  </div>
</div>
</body>
</html>
